[package]
name = "qora-server"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
qor4b = { path = "../qora-llm" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
half = { workspace = true }

[dev-dependencies]
qor4b = { path = "../qora-llm", features = ["mock-weights"] }
tempfile = "3"

[features]
mock-weights = ["qor4b/mock-weights"]

[[test]]
name = "llm_engine_smoke"
path = "tests/llm_engine_smoke.rs"
required-features = ["mock-weights"]
