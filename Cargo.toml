[workspace]
members = [
    "crates/qora-llm",
    "crates/qora-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Shared dep versions (each crate declares which it actually uses)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
rayon = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
